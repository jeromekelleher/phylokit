name: Tests

on:
  pull_request:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Install lint group
        run: uv sync --locked --only-group lint

      - name: Run prek
        run: uv run --locked --only-group lint prek run --all-files --show-diff-on-failure

  test:
    name: Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        os: [macos-latest, ubuntu-latest] # disable windows for now, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install test deps
        run: uv sync --locked --group test --no-default-groups

      - name: Run tests
        run: uv run --no-sync coverage run --source=phylokit -m pytest -x -n0

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Install test deps
        run: uv sync --locked --group test --no-default-groups

      - name: Generate coverage
        run: |
          PHYLOKIT_DISABLE_NUMBA=1 uv run --no-sync coverage run --source=phylokit -m pytest -x -n0

      - name: Upload coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync coveralls --service=github

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.12"

      - name: Install packaging deps
        run: uv sync --locked --group packaging --no-default-groups

      - name: Validate pyproject
        run: uv run --no-sync validate-pyproject pyproject.toml

      - name: Build artefacts
        run: uv build

      - name: Twine check
        run: uv run --no-sync twine check --strict dist/*

      - name: Install wheel into a clean venv
        run: |
          # Pin dependencies to the lockfile, since [tool.uv.sources] does not
          # apply when installing the wheel.
          uv export --locked --no-dev --no-emit-project -o wheel-reqs.txt
          uv venv wheel-test
          uv pip install --python=wheel-test -r wheel-reqs.txt dist/*.whl
          ./wheel-test/bin/python -c "import phylokit"
