# The prek configuration defining linting requirements. Run with
# `uv run prek run --all-files`.

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files", exclude = '^uv\.lock$' },
    { id = "check-merge-conflict" },
    { id = "mixed-line-ending" },
    { id = "check-case-conflict" },
    { id = "check-yaml" },
    { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    language = "system",
    entry = "uv run --only-group=lint ruff check --fix --force-exclude",
    types = ["python"],
  },
  {
    id = "ruff-format",
    name = "ruff format",
    language = "system",
    entry = "uv run --only-group=lint ruff format --force-exclude",
    types = ["python"],
  },
]
